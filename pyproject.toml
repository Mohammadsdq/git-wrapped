[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-wrapped"
version = "0.2.0"
description = "Your year in git: a Spotify-Wrapped-style summary of your commits, as a shareable SVG card and a terminal report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "wrapped", "github", "stats", "cli", "svg", "developer-tools", "year-in-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
git-wrapped = "git_wrapped.cli:main"

[tool.setuptools.packages.find]
include = ["git_wrapped*"]
